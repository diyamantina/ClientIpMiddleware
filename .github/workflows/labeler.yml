name: Issue labeler

# Issue forms render each dropdown as a `### <label>` heading followed by the
# selected value in the issue body; they do NOT apply labels on their own.
# This workflow reads the Priority dropdown and applies (or removes) the
# `priority: high` label to match. Kind labels (`bug` / `enhancement`) are
# applied by the form templates themselves; Complexity is informational and
# has no label by design (see git-discipline rule 2.1).

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            // Capture the value under the "### Priority" heading.
            const match = body.match(/###\s*Priority\s*\n+\s*([^\n]+)/i);
            const value = match ? match[1].trim() : "";
            const label = "priority: high";
            const isHigh = value.toLowerCase() === "high";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const labels = context.payload.issue.labels.map(l => l.name);
            const hasLabel = labels.includes(label);
            if (isHigh && !hasLabel) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
            } else if (!isHigh && hasLabel) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
            }
