name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Platform support: macOS + Linux only.
#
# ClientIpMiddleware is a Vapor `AsyncMiddleware` and Vapor itself does not
# ship for iOS / tvOS / watchOS, so there is no iOS row in this matrix.
# Linux is the primary deployment target.

jobs:
  linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test --parallel

  macos:
    name: Swift on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test --parallel
