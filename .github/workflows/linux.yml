name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Linux CI: full `swift build` + `swift test` in the official Swift container.
# Linux is the primary deployment target for this Vapor middleware, so the
# Glibc / non-Darwin code paths are exercised end-to-end here. macOS coverage
# lives in macos.yml.

jobs:
  linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test --parallel
