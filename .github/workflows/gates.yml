name: Gates

# Linux CI backstop for the local git hooks (.githooks). Runs the same style
# gates so a violation cannot reach main even if a contributor has not installed
# the hooks: no em dashes (U+2014), no AI-attribution tells, and a CHANGELOG
# entry whenever production source changes in a PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  style:
    name: Style gate (em dash + attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes in tracked files
        run: |
          emdash=$(printf '\342\200\224')
          if git grep -n "$emdash" -- . \
              ':(exclude)LICENSE' \
              ':(exclude).githooks/*' \
              ':(exclude).github/workflows/gates.yml'; then
            echo "::error::em dash (U+2014) found above. Replace with a comma, period, or colon."
            exit 1
          fi
          echo "No em dashes found."
      - name: No AI-attribution tells in tracked files
        run: |
          if git grep -niE 'co-authored-by:[^@]*(claude|copilot|chatgpt)|generated (with|by)[^.]{0,30}(claude|copilot|chatgpt)|claude code|anthropic' -- . \
              ':(exclude).githooks/*' \
              ':(exclude).github/workflows/gates.yml'; then
            echo "::error::AI-attribution tell found above."
            exit 1
          fi
          echo "No AI-attribution tells found."

  changelog:
    name: CHANGELOG gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG entry when production source changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          if echo "$changed" | grep -qE '^Sources/.*\.swift$'; then
            if echo "$changed" | grep -qE '^CHANGELOG\.md$'; then
              echo "CHANGELOG.md updated."
            elif git log --format=%B "$base..$head" | grep -q '\[no-changelog\]'; then
              echo "Opted out via [no-changelog]."
            else
              echo "::error::Sources changed but CHANGELOG.md was not updated. Add an entry under [Unreleased], or put [no-changelog] in a commit body."
              exit 1
            fi
          else
            echo "No production source changed."
          fi
