name: Bug report
description: Something ships incorrectly in ClientIpMiddleware.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not file security issues here; see
        [SECURITY.md](../../SECURITY.md) instead.
  - type: input
    id: status-date
    attributes:
      label: Status date
      description: Today's date, in YYYY-MM-DD form. Keep this current as the issue evolves.
      placeholder: 2026-06-02
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What goes wrong? What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal, ordered list. Include the middleware config and any relevant headers (for example the X-Forwarded-For value and trustedProxyHops).
      placeholder: |
        1. ...
        2. ...
        3. ...
      render: swift
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is fixed?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: High means critical, release-gating, or actively blocking. Otherwise leave as Normal.
      options:
        - Normal
        - High
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: A rough estimate. Informational only; it does not become a label.
      options:
        - Small
        - Medium
        - Large
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Linux
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The ClientIpMiddleware version or commit SHA where you saw this.
      placeholder: "1.0.0"
    validations:
      required: false
